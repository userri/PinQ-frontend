  <path class="arrow-dashed" d="M1218 802 C1334 744 1400 672 1510 674"/>
  <path class="arrow-dashed" d="M1218 824 C1338 838 1400 814 1510 814"/>
  <text class="tiny" x="1394" y="636" text-anchor="middle">daily quiz generation</text>

  <path class="arrow" d="M1218 830 C1260 818 1274 742 1284 742"/>

  <!-- Numbered callouts -->
