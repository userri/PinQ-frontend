  <!-- Legend / callout descriptions -->
  <g transform="translate(44 970)">
    <rect x="0" y="0" width="1826" height="78" rx="8" fill="#f8fafc" stroke="#d1d5db"/>
    <text class="tiny" x="18" y="24">1 Compose 화면/내비게이션 · 2 DataStore 세션 · 3 Retrofit/OkHttp 인증 · 4 Nginx blue/green 프록시 · 5 Spring Security · 6 AuthController/JWT/refresh · 7 Quiz/User/Library API</text>
    <text class="tiny" x="18" y="50">8 도메인 서비스/통계/북마크 · 9 매일 06:00 KST 퀴즈 생성 · 10 Redis refresh token rotation · 11 MySQL JPA 도메인 · 12 Kakao/Google OAuth · 13 Naver/OpenAI/Claude 생성 파이프라인</text>
  </g>
