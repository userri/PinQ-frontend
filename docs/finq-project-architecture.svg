<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">FinQ project architecture diagram</title>
  <desc id="desc">Project-specific architecture diagram for the FinQ Android frontend and Spring Boot backend.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f70c1"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #111827; }
      .small-title { font: 700 18px "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #111827; }
      .label { font: 600 16px "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #202124; }
      .sub { font: 500 13px "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #4b5563; }
      .tiny { font: 500 12px "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #5f6368; }
      .boundary-red { fill: none; stroke: #ef4444; stroke-width: 2.5; stroke-dasharray: 9 9; }
      .boundary-orange { fill: none; stroke: #f59e0b; stroke-width: 2.5; stroke-dasharray: 5 10; }
      .boundary-blue { fill: none; stroke: #3b82f6; stroke-width: 2.5; stroke-dasharray: 5 10; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .panel-blue { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; }
      .panel-green { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.5; }
      .panel-yellow { fill: #fffbeb; stroke: #fcd34d; stroke-width: 1.5; }
      .panel-red { fill: #fff1f2; stroke: #fda4af; stroke-width: 1.5; }
      .icon-orange { fill: #f97316; stroke: #c2410c; stroke-width: 1.2; }
      .icon-blue { fill: #2563eb; stroke: #1d4ed8; stroke-width: 1.2; }
      .icon-green { fill: #16a34a; stroke: #15803d; stroke-width: 1.2; }
      .icon-red { fill: #ef4444; stroke: #b91c1c; stroke-width: 1.2; }
      .icon-gold { fill: #d97706; stroke: #92400e; stroke-width: 1.2; }
      .arrow { fill: none; stroke: #5f6368; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-blue { fill: none; stroke: #1f70c1; stroke-width: 2.4; marker-end: url(#arrow-blue); }
      .arrow-dashed { fill: none; stroke: #5f6368; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .callout-oval { fill: #c9ccd1; stroke: #6b7280; stroke-width: 1.5; filter: url(#soft-shadow); }
      .callout-text { font: 700 18px Arial, sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: central; }
      .box-text { font: 700 14px "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .box-sub { font: 500 12px "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #4b5563; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" width="1920" height="1080"/>
  <text class="title" x="44" y="54">FinQ 프로젝트 아키텍처</text>
  <text class="sub" x="44" y="82">Android Compose frontend + Spring Boot backend + Redis/MySQL + News/AI quiz generation</text>

  <!-- Users and devices -->
  <g transform="translate(54 190)">
    <circle cx="28" cy="22" r="15" fill="#111"/>
    <circle cx="60" cy="22" r="15" fill="#111"/>
    <circle cx="44" cy="47" r="18" fill="#111"/>
    <path d="M14 82c4-20 22-32 38-32s34 12 38 32z" fill="#111"/>
    <text class="label" x="48" y="112" text-anchor="middle">사용자</text>
  </g>
  <g transform="translate(64 770)">
    <rect x="0" y="0" width="84" height="142" rx="16" fill="#111827"/>
    <rect x="11" y="17" width="62" height="104" rx="6" fill="#ffffff"/>
    <rect x="32" y="8" width="20" height="4" rx="2" fill="#ffffff"/>
    <circle cx="42" cy="131" r="5" fill="#ffffff"/>
    <text class="label" x="42" y="174" text-anchor="middle">Android 기기</text>
  </g>

  <!-- Android app boundary -->
  <rect class="boundary-blue" x="190" y="130" width="340" height="820"/>
  <text class="small-title" x="306" y="122">FinQ Frontend</text>
  <text class="sub" x="306" y="148" text-anchor="middle">/AndroidStudioProjects/PinQ_frontend</text>

  <g transform="translate(222 178)">
    <rect class="panel-blue" x="0" y="0" width="276" height="118" rx="8"/>
    <text class="label" x="138" y="28" text-anchor="middle">Jetpack Compose UI</text>
    <text class="sub" x="138" y="55" text-anchor="middle">Login · Home · Quiz · Answer</text>
    <text class="sub" x="138" y="78" text-anchor="middle">Library · MyPage · Result</text>
    <path d="M42 99h192" stroke="#93c5fd" stroke-width="1"/>
    <text class="tiny" x="138" y="108" text-anchor="middle">FinQNavigation</text>
  </g>

  <g transform="translate(222 338)">
    <rect class="panel" x="0" y="0" width="276" height="112" rx="8"/>
    <text class="label" x="138" y="28" text-anchor="middle">ViewModels</text>
    <text class="sub" x="138" y="55" text-anchor="middle">Login · Home · QuizSession</text>
    <text class="sub" x="138" y="78" text-anchor="middle">Library · WrongNote · MyPage</text>
  </g>

  <g transform="translate(222 490)">
    <rect class="panel" x="0" y="0" width="276" height="120" rx="8"/>
    <text class="label" x="138" y="29" text-anchor="middle">Repositories</text>
    <text class="sub" x="138" y="57" text-anchor="middle">AuthRepository</text>
    <text class="sub" x="138" y="79" text-anchor="middle">ApiQuiz · ApiLibrary</text>
    <text class="sub" x="138" y="101" text-anchor="middle">ApiUserStatsRepository</text>
  </g>

  <g transform="translate(222 650)">
    <rect class="panel-yellow" x="0" y="0" width="276" height="126" rx="8"/>
    <text class="label" x="138" y="30" text-anchor="middle">NetworkModule</text>
    <text class="sub" x="138" y="58" text-anchor="middle">Retrofit · OkHttp · Moshi</text>
    <text class="sub" x="138" y="80" text-anchor="middle">Bearer Interceptor</text>
    <text class="sub" x="138" y="102" text-anchor="middle">401 Authenticator → refresh</text>
  </g>

  <g transform="translate(222 816)">
    <rect class="panel-green" x="0" y="0" width="276" height="82" rx="8"/>
    <text class="label" x="138" y="30" text-anchor="middle">SessionManager</text>
    <text class="sub" x="138" y="57" text-anchor="middle">DataStore: access/refresh/userId</text>
  </g>

  <path class="arrow" d="M104 292 C130 292 150 238 190 238"/>
  <path class="arrow" d="M106 842 C132 842 154 840 190 838"/>
  <path class="arrow" d="M360 296 L360 338"/>
  <path class="arrow" d="M360 450 L360 490"/>
  <path class="arrow" d="M360 610 L360 650"/>
  <path class="arrow" d="M360 776 L360 816"/>

  <!-- Backend deployment boundary -->
  <rect class="boundary-red" x="570" y="104" width="840" height="846"/>
  <text class="small-title" x="1208" y="92">Backend Server / AWS EC2 Docker</text>
  <text class="sub" x="1208" y="118" text-anchor="middle">/Users/admin/Documents/AES/pinq_backend</text>

  <g transform="translate(615 158)">
    <rect class="panel-red" x="0" y="0" width="200" height="102" rx="8"/>
    <path class="icon-red" d="M58 22 h84 l18 18 v32 l-18 18 h-84 l-18-18 v-32z"/>
    <text class="box-text" x="100" y="50">Nginx</text>
    <text class="box-sub" x="100" y="74">:80 reverse proxy</text>
  </g>

  <g transform="translate(860 136)">
    <rect class="panel-yellow" x="0" y="0" width="424" height="118" rx="8"/>
    <text class="label" x="212" y="28" text-anchor="middle">Blue / Green App Containers</text>
    <g transform="translate(58 48)">
      <rect x="0" y="0" width="112" height="46" rx="6" fill="#ecfeff" stroke="#06b6d4"/>
      <text class="box-text" x="56" y="19">app-blue</text>
      <text class="box-sub" x="56" y="36">:8080</text>
    </g>
    <g transform="translate(254 48)">
      <rect x="0" y="0" width="112" height="46" rx="6" fill="#f0fdf4" stroke="#22c55e"/>
      <text class="box-text" x="56" y="19">app-green</text>
      <text class="box-sub" x="56" y="36">:8080</text>
    </g>
  </g>

  <g transform="translate(650 304)">
    <rect class="panel" x="0" y="0" width="610" height="560" rx="10"/>
    <text class="small-title" x="305" y="34" text-anchor="middle">Spring Boot 4 / Java 17 API</text>
    <text class="sub" x="305" y="58" text-anchor="middle">SecurityConfig · JPA · Validation · Actuator · Springdoc</text>

    <g transform="translate(42 86)">
      <rect class="panel-red" x="0" y="0" width="526" height="74" rx="8"/>
      <text class="label" x="263" y="28" text-anchor="middle">Security Filter Chain</text>
      <text class="sub" x="263" y="53" text-anchor="middle">AdminAuthFilter(X-Admin-Secret) → JwtAuthFilter(Bearer userId)</text>
    </g>

    <g transform="translate(42 188)">
      <rect class="panel-blue" x="0" y="0" width="526" height="116" rx="8"/>
      <text class="label" x="263" y="28" text-anchor="middle">REST Controllers</text>
      <text class="sub" x="263" y="55" text-anchor="middle">/api/auth · /api/quizzes · /api/users</text>
      <text class="sub" x="263" y="78" text-anchor="middle">/api/me · /api/bookmarks · /api/admin/quizzes</text>
      <text class="tiny" x="263" y="100" text-anchor="middle">AuthController · QuizController · User/Library/Admin controllers</text>
    </g>

    <g transform="translate(42 332)">
      <rect class="panel-green" x="0" y="0" width="526" height="110" rx="8"/>
      <text class="label" x="263" y="28" text-anchor="middle">Domain Services</text>
      <text class="sub" x="263" y="55" text-anchor="middle">UserService · QuizService · BookmarkService</text>
      <text class="sub" x="263" y="78" text-anchor="middle">UserStats · AttemptHistory · RefreshTokenService</text>
    </g>

    <g transform="translate(42 470)">
      <rect class="panel-yellow" x="0" y="0" width="250" height="66" rx="8"/>
      <text class="label" x="125" y="27" text-anchor="middle">JPA Repositories</text>
      <text class="sub" x="125" y="50" text-anchor="middle">Quiz · User · Article</text>
    </g>
    <g transform="translate(318 470)">
      <rect class="panel-yellow" x="0" y="0" width="250" height="66" rx="8"/>
      <text class="label" x="125" y="27" text-anchor="middle">Daily Quiz Generator</text>
      <text class="sub" x="125" y="50" text-anchor="middle">06:00 KST Scheduler + Admin API</text>
    </g>
  </g>

  <!-- Data stores inside deployment boundary -->
  <g transform="translate(1290 394)">
    <path class="icon-red" d="M54 0 C96 0 108 13 108 24 V104 C108 119 92 132 54 132 C16 132 0 119 0 104 V24 C0 13 12 0 54 0 Z"/>
    <ellipse cx="54" cy="24" rx="54" ry="24" fill="#fecaca" stroke="#b91c1c" stroke-width="1.2"/>
    <text class="box-text" x="54" y="55">Redis</text>
    <text class="box-sub" x="54" y="80">refresh:{token}</text>
    <text class="box-sub" x="54" y="101">30d TTL</text>
  </g>

  <g transform="translate(1284 660)">
    <path class="icon-blue" d="M60 0 C106 0 120 14 120 26 V126 C120 142 102 156 60 156 C18 156 0 142 0 126 V26 C0 14 14 0 60 0 Z"/>
    <ellipse cx="60" cy="26" rx="60" ry="26" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.2"/>
    <text class="box-text" x="60" y="61">MySQL</text>
    <text class="box-sub" x="60" y="86">users · quiz · choice</text>
    <text class="box-sub" x="60" y="108">news_article</text>
    <text class="box-sub" x="60" y="130">attempt · bookmark</text>
  </g>

  <g transform="translate(1282 846)">
    <rect class="panel" x="0" y="0" width="130" height="56" rx="8"/>
    <text class="box-text" x="65" y="24">H2</text>
    <text class="box-sub" x="65" y="43">local h2 profile</text>
  </g>

  <!-- External services boundary -->
  <rect class="boundary-orange" x="1460" y="130" width="390" height="820"/>
  <text class="small-title" x="1648" y="122">External Providers</text>

  <g transform="translate(1510 178)">
    <rect class="panel-yellow" x="0" y="0" width="280" height="92" rx="8"/>
    <circle class="icon-gold" cx="58" cy="46" r="25"/>
    <text class="label" x="170" y="35" text-anchor="middle">Kakao API</text>
    <text class="sub" x="170" y="61" text-anchor="middle">SDK login + token verify</text>
  </g>

  <g transform="translate(1510 308)">
    <rect class="panel-blue" x="0" y="0" width="280" height="92" rx="8"/>
    <circle class="icon-blue" cx="58" cy="46" r="25"/>
    <text class="label" x="170" y="35" text-anchor="middle">Google OAuth</text>
    <text class="sub" x="170" y="61" text-anchor="middle">Credential Manager + tokeninfo</text>
  </g>

  <g transform="translate(1510 486)">
    <rect class="panel-green" x="0" y="0" width="280" height="96" rx="8"/>
    <path class="icon-green" d="M37 21 h42 l22 24 -22 24 h-42 l-22-24z"/>
    <text class="label" x="170" y="36" text-anchor="middle">Naver News API</text>
    <text class="sub" x="170" y="63" text-anchor="middle">search/news + article scrape</text>
  </g>

  <g transform="translate(1510 626)">
    <rect class="panel" x="0" y="0" width="280" height="96" rx="8"/>
    <path class="icon-orange" d="M58 18 l31 18 v36 l-31 18 -31-18 v-36z"/>
    <text class="label" x="170" y="36" text-anchor="middle">OpenAI API</text>
    <text class="sub" x="170" y="63" text-anchor="middle">news → 4-choice quiz JSON</text>
  </g>

  <g transform="translate(1510 766)">
    <rect class="panel-red" x="0" y="0" width="280" height="96" rx="8"/>
    <path class="icon-red" d="M58 18 l31 18 v36 l-31 18 -31-18 v-36z"/>
    <text class="label" x="170" y="36" text-anchor="middle">Anthropic Claude</text>
    <text class="sub" x="170" y="63" text-anchor="middle">cross-model answer verify</text>
  </g>

