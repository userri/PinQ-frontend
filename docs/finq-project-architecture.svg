    <ellipse class="callout-oval" cx="208" cy="154" rx="28" ry="20"/><text class="callout-text" x="208" y="154">1</text>
    <ellipse class="callout-oval" cx="512" cy="850" rx="28" ry="20"/><text class="callout-text" x="512" y="850">2</text>
    <ellipse class="callout-oval" cx="512" cy="688" rx="28" ry="20"/><text class="callout-text" x="512" y="688">3</text>
