  <path class="arrow-blue" d="M498 713 C548 713 552 208 615 208"/>
  <text class="tiny" x="540" y="596" text-anchor="middle">BASE_URL</text>
  <text class="tiny" x="540" y="613" text-anchor="middle">HTTP API</text>
